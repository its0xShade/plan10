<text x="305" y="304" text-anchor="middle" font-size="11" fill="#a1a1ab">مکالمه روزمره پایه</text>
<rect x="390" y="176" width="140" height="164" rx="10" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
<text x="460" y="202" text-anchor="middle" font-size="17" font-weight="bold" fill="#fbbf24">B1</text>
