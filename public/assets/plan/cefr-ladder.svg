<text x="150" y="346" text-anchor="middle" font-size="12" fill="#f4f4f5">ماه ۱–۳</text>
<text x="150" y="366" text-anchor="middle" font-size="11" fill="#a1a1ab">شروع از صفر — جملات ساده</text>
<rect x="235" y="238" width="140" height="102" rx="10" fill="#4ade80" opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
