<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Tahoma, Vazirmatn, sans-serif" direction="rtl">
<rect width="720" height="360" rx="16" fill="#141419"/>
<text x="360.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#fbbf24">نردبان زبان: صفر تا B1/B2 در ۱۰ ماه</text>
